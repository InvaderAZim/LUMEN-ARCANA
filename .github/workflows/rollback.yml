name: Rollback Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Exact previous Cloudflare Worker version ID (UUID) to restore"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Manual production rollback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: lumen-arcana-production
      cancel-in-progress: false
    steps:
      - name: Validate explicit rollback version
        env:
          VERSION_ID: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ ! "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo '::error::Supply a valid Cloudflare Worker version UUID from the Cloudflare dashboard.'
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Cloudflare deployment secrets are not configured.'
            exit 1
          fi

      - name: Checkout Worker configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore the explicitly selected version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
        shell: bash
        run: |
          npx wrangler rollback "$VERSION_ID" --message "Manual rollback via GitHub Actions"
          {
            echo '### Manual Cloudflare rollback submitted'
            echo "Restored Worker version: $VERSION_ID"
            echo 'Check the Cloudflare dashboard Deployments tab and live application.'
          } >> "$GITHUB_STEP_SUMMARY"
